name: Capacidad o adaptador
description: Proponer una operación concreta reutilizando el original.
body:
  - type: textarea
    id: operation
    attributes: {label: "Herramienta, versión, operación, pregunta y municipio propuesto"}
    validations: {required: true}
  - type: textarea
    id: reuse
    attributes: {label: "API/MCP existente y brecha que requiere código nuevo"}
    validations: {required: true}
  - type: textarea
    id: data
    attributes: {label: "Entradas, fuentes, transformaciones y faltantes de operador"}
    validations: {required: true}
  - type: textarea
    id: proof
    attributes: {label: "Cosecha, resultado municipal, comparación nativa/MCP y reproducción independiente"}
    validations: {required: true}
