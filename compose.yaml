name: urban-mcp-planning
x-municipal: &municipal
  profiles: [municipal]
  image: urban-mcp-inventory:dev
  user: "${URBAN_MCP_UID:-65532}:${URBAN_MCP_GID:-65532}"
  build:
    context: .
    dockerfile: adapters/municipal_inventory/Dockerfile
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  cpus: 2
  mem_limit: 1g
  pids_limit: 128
  network_mode: bridge
  tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
  volumes:
    - ${URBAN_MCP_WORKDIR:-./.urban-mcp/helsinki}:/data
x-walking: &walking
  profiles: [walking]
  image: urban-mcp-walking:dev
  user: "${URBAN_MCP_UID:-65532}:${URBAN_MCP_GID:-65532}"
  build:
    context: .
    dockerfile: adapters/walking/Dockerfile
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  cpus: 2
  mem_limit: 3g
  pids_limit: 128
  network_mode: none
  tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
  volumes:
    - ${URBAN_MCP_WALKING_WORKDIR:-./.urban-mcp/walking}:/data
services:
  walking:
    <<: *walking
  walking-harvest:
    <<: *walking
    network_mode: bridge
    command: [harvest]
  walking-mcp:
    <<: *walking
    network_mode: bridge
    stdin_open: true
    command: [serve]
  inventory:
    <<: *municipal
    network_mode: none
    command: [status]
  harvest:
    <<: *municipal
    command: [harvest, --mode, live]
  municipal-mcp:
    <<: *municipal
    stdin_open: true
    command: [serve]
  preflight:
    profiles: [preflight]
    build:
      context: .
      dockerfile: sandbox/preflight/Dockerfile
    command: [tools/validate.py]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 128m
    pids_limit: 64
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    volumes:
      - .:/workspace:ro
