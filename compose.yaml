name: urban-mcp-planning
x-municipal: &municipal
  profiles: [municipal]
  image: urban-mcp-inventory:dev
  user: "${URBAN_MCP_UID:-65532}:${URBAN_MCP_GID:-65532}"
  build:
    context: .
    dockerfile: adapters/municipal_inventory/Dockerfile
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  cpus: 2
  mem_limit: 1g
  pids_limit: 128
  network_mode: bridge
  tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
  volumes:
    - ${URBAN_MCP_WORKDIR:-./.urban-mcp/helsinki}:/data
x-walking: &walking
  profiles: [walking]
  image: urban-mcp-walking:dev
  user: "${URBAN_MCP_UID:-65532}:${URBAN_MCP_GID:-65532}"
  build:
    context: .
    dockerfile: adapters/walking/Dockerfile
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  cpus: 2
  mem_limit: 3g
  pids_limit: 128
  network_mode: none
  tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
  volumes:
    - ${URBAN_MCP_WALKING_WORKDIR:-./.urban-mcp/walking}:/data
x-vegetation: &vegetation
  profiles: [vegetation]
  image: urban-mcp-vegetation:dev
  user: "${URBAN_MCP_UID:-65532}:${URBAN_MCP_GID:-65532}"
  build:
    context: .
    dockerfile: adapters/vegetation/Dockerfile
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  cpus: 2
  mem_limit: 2g
  pids_limit: 128
  network_mode: none
  tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
  volumes:
    - ${URBAN_MCP_VEGETATION_WORKDIR:-./.urban-mcp/vegetation}:/data
x-sumo: &sumo
  profiles: [sumo]
  platform: linux/amd64
  image: urban-mcp-sumo:dev
  user: "${URBAN_MCP_UID:-65532}:${URBAN_MCP_GID:-65532}"
  build:
    context: .
    dockerfile: adapters/sumo/Dockerfile
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  cpus: 2
  mem_limit: 3g
  pids_limit: 128
  network_mode: none
  tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
  volumes:
    - ${URBAN_MCP_SUMO_WORKDIR:-./.urban-mcp/sumo}:/data
x-swmm: &swmm
  profiles: [swmm]
  init: true
  platform: linux/amd64
  image: urban-mcp-swmm:dev
  user: "${URBAN_MCP_UID:-65532}:${URBAN_MCP_GID:-65532}"
  build:
    context: .
    dockerfile: adapters/swmm/Dockerfile
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  cpus: 2
  mem_limit: 3g
  pids_limit: 128
  network_mode: none
  tmpfs: ["/tmp:rw,noexec,nosuid,size=128m", "/.config:rw,noexec,nosuid,size=1m,mode=1777"]
  volumes:
    - ${URBAN_MCP_SWMM_WORKDIR:-./.urban-mcp/swmm}:/data
services:
  swmm:
    <<: *swmm
  swmm-harvest:
    <<: *swmm
    network_mode: bridge
    command: [harvest]
  swmm-mcp:
    <<: *swmm
    network_mode: bridge
    stdin_open: true
    command: [serve]
  sumo:
    <<: *sumo
  sumo-harvest:
    <<: *sumo
    network_mode: bridge
    command: [harvest]
  sumo-mcp:
    <<: *sumo
    network_mode: bridge
    stdin_open: true
    command: [serve]
  vegetation:
    <<: *vegetation
  vegetation-harvest:
    <<: *vegetation
    network_mode: bridge
    command: [harvest]
  vegetation-mcp:
    <<: *vegetation
    network_mode: bridge
    stdin_open: true
    command: [serve]
  walking:
    <<: *walking
  walking-harvest:
    <<: *walking
    network_mode: bridge
    command: [harvest]
  walking-mcp:
    <<: *walking
    network_mode: bridge
    stdin_open: true
    command: [serve]
  inventory:
    <<: *municipal
    network_mode: none
    command: [status]
  harvest:
    <<: *municipal
    command: [harvest, --mode, live]
  municipal-mcp:
    <<: *municipal
    stdin_open: true
    command: [serve]
  preflight:
    profiles: [preflight]
    build:
      context: .
      dockerfile: sandbox/preflight/Dockerfile
    command: [tools/validate.py]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 128m
    pids_limit: 64
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    volumes:
      - .:/workspace:ro
